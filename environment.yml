# Conda environment for BARCC on Python 3.14
# Create / refresh:
#   conda env create -f environment.yml
#   conda env update -f environment.yml --prune
#
# Activate and run:
#   conda activate barcc314
#   python Application/barcc.py
# or double-click Application/Launch_BARCC.bat

name: barcc314
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.14
  - pip
  - tk
  - pip:
      - PyMuPDF>=1.21.0
      - Pillow>=9.3.0
      - numpy>=1.23.0
      - scikit-image>=0.19.0
      - scipy>=1.9.0
      - pandas>=1.5.0
      - openpyxl>=3.0.10
      - PyYAML>=6.0.0
      - fpdf2>=2.7.0
      - xlsxwriter>=3.0.0
